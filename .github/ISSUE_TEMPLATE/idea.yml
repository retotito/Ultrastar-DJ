name: Suggest an idea
description: Something that would make your karaoke night better.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would it help?
      description: The situation at your party where you missed it.
