# Builds the installable apps on GitHub's machines (docs/06-build-release.md):
#   macOS Apple Silicon → .dmg, macOS Intel → .dmg, Windows x64 → Setup.exe (Velopack).
# Each job fetches the native parts (mpv, yt-dlp, ffmpeg, cloudflared), runs the tests and uploads its package
# as an artifact (Actions → this run → Artifacts). Started by hand (Run workflow) or by a push of a v* tag.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-14          # Apple Silicon
          - rid: osx-x64
            runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native parts (Homebrew mpv + dylibbundler, yt-dlp, ffmpeg, cloudflared)
        run: zsh scripts/fetch-natives.sh
      - name: Tests
        run: dotnet test --nologo -v q
      - name: App + dmg
        run: zsh scripts/publish-macos.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Ultrastar-DJ-${{ matrix.rid }}
          path: out/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native parts (libmpv, yt-dlp, ffmpeg, cloudflared)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-natives.ps1
      - name: Tests
        run: dotnet test --nologo -v q
      - name: Velopack
        run: dotnet tool install -g vpk --version 1.2.161
      - name: App + Setup.exe
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Ultrastar-DJ-win-x64
          path: out/Releases/*
          if-no-files-found: error
